<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css"/>
    <title>Log In</title>
</head>
<body>
    <header></header>
    <main>
        <img id="logInImage" src="../Images/log_in.png" alt="Log In">
        <div class="horizontal">
          <div class="vertical">
            <a href="homepage.html"> <img class="button" id = "exitButton" src="../Images/exit.png"></a>
          </div>
          <div class="vertical">
            <input type="text" id="userBox" placeholder="Please enter username.">
            <input type="password" id="passwordBox" placeholder="Please enter password.">
            <img class="button" id="enterButton" src="../Images/enter.png" alt="Enter">
            <p id="message"></p>
          </div>
        </div>

<script>
  const ws = new WebSocket("ws://localhost:8765");



  document.getElementById("enterButton").addEventListener("click", () => {
    ws.send(JSON.stringify({
      action: "connexion",
      nom: document.getElementById("userBox").value.trim(),
      mdp: document.getElementById("passwordBox").value
    }));
  });

  ws.onmessage = (event) => {
    const r = JSON.parse(event.data);
    if (r.action !== "connexion") return;
    if (r.ok) {
      sessionStorage.setItem("token", r.token);
      window.location.href = "menu_page.html";
    } else {
      document.getElementById("message").textContent = "Incorrect username or password.";
    }
  };
</script>


    </main>
    <footer></footer>

</body>
</html>
