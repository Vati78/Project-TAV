<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="log_in_page.css"/>
    <title>Log In</title>
</head>
<body>
    <header></header>
    <main>
        
        <div >Userbutton</div>
        <img id="logInButton" src="../Images/log_in.png" alt="Log In">
        <a href="homepage.html"> <img id = "exitButton" src="../Images/exit.png"></a>

        <input type="username" id="userBox" placeholder="Please enter username.">
        <input type="password" id="passwordBox" placeholder="Please enter password.">
        <img id="enterButton" src="../Images/enter.png" alt="Enter">

        <p id="message"></p>

<script>
  const ws = new WebSocket("ws://localhost:8765");

  document.getElementById("enterButton").addEventListener("click", () => {
    ws.send(JSON.stringify({
      action: "connexion",
      nom: document.getElementById("userBox").value.trim(),
      mdp: document.getElementById("passwordBox").value
    }));
  });

  ws.onmessage = (event) => {
    const reponse = JSON.parse(event.data);
    if (reponse.ok) {
      window.location.href = "menu_page.html";
    } else {
      document.getElementById("message").textContent = "Incorrect username or password.";
    }
  };
</script>


    </main>
    <footer></footer>

</body>
</html>
