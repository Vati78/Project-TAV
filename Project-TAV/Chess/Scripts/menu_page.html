<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css"/>
    <title>Menu</title>
</head>
<body>
    <header></header>
    <main>

        <img class="button" id ="gameButton" src = "../Images/play.png" alt = "Play">   
        <img class="button" id ="optionsButton" src = "../Images/options.png" alt = "Options">
        <a href="homepage.html"> <img class="button" id = "exitButton" src="../Images/exit.png"></a>
        
    <script>
        const ws = new WebSocket("ws://localhost:8765");

        ws.onopen = () => {
            const token = sessionStorage.getItem("token");
            if (!token) { window.location.href = "login_page.html"; return; }
            ws.send(JSON.stringify({ action: "reprise", token }));
        };

        document.getElementById("exitButton").addEventListener("click", () => {
            ws.send(JSON.stringify({
            action: "quitter_menu",
            token: sessionStorage.getItem("token"),
            }));
        });

        document.getElementById("gameButton").addEventListener("click", () => {
            ws.send(JSON.stringify({
            action: "attente_partie",
            }));
        });

        ws.onmessage = (event) => {
            const r = JSON.parse(event.data);
            if (r.action === "reprise" && !r.ok) window.location.href = "login.html";
            if (r.action === "partie_trouvee") window.location.href = "game_page.html";
            if (r.action === "erreur") console.log(r.message);
        };
        

    </script>
    </main>
    <footer></footer>

</body>
</html>
